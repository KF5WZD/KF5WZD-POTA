name: Update POTA stats card

on:
  schedule:
    - cron: "17 11 * * *"   # once a day, 11:17 UTC
  workflow_dispatch:         # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: pota-card
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the card
        run: python3 generate_card.py

      - name: Commit if changed
        run: |
          git config user.name "pota-card-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/pota-stats.svg
          git diff --cached --quiet || git commit -m "Update POTA stats"
          git pull --rebase
          git push
